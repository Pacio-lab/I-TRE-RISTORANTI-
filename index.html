<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101018">
<title>Una cena per noi ❤️</title>
<style>
:root{
  --bg:#101018;
  --text:#f5f5f7;
  --muted:#98989d;
  --glass:rgba(255,255,255,.075);
  --border:rgba(255,255,255,.16);
  --pink:#e52e71;
  --purple:#9c27b0;
  --blue:#03a9f4;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--text);
  min-height:100vh;
  min-height:100dvh;
  padding:32px 18px;
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
.bg{
  position:fixed;
  inset:0;
  z-index:-1;
  overflow:hidden;
  background:
    linear-gradient(135deg,#101018,#1a1a24 50%,#141727);
}
.bg:before{
  content:"";
  position:absolute;
  width:145%;
  height:145%;
  left:-22%;
  top:-22%;
  background:
    radial-gradient(circle at 18% 25%,rgba(229,46,113,.22),transparent 42%),
    radial-gradient(circle at 82% 72%,rgba(3,169,244,.19),transparent 44%);
  animation:drift 18s ease-in-out infinite alternate;
}
@keyframes drift{
  from{transform:translate3d(-3%,-3%,0)}
  to{transform:translate3d(4%,4%,0) scale(1.08)}
}
main{
  width:100%;
  max-width:820px;
  margin:auto;
}
.hero{
  text-align:center;
  margin-bottom:30px;
}
.orb{
  width:72px;
  height:72px;
  margin:0 auto 22px;
  border-radius:50%;
  background:
    radial-gradient(
      circle at 30% 30%,
      #ff9a00,
      #e52e71 45%,
      #9c27b0 70%,
      #03a9f4
    );
  box-shadow:
    0 0 30px rgba(229,46,113,.4),
    0 0 80px rgba(3,169,244,.12);
  animation:breathe 3s ease-in-out infinite alternate;
}
@keyframes breathe{
  from{transform:scale(.92);opacity:.78}
  to{transform:scale(1.08);opacity:1}
}
h1{
  font-size:clamp(1.65rem,5vw,2.25rem);
  font-weight:300;
  letter-spacing:.2px;
}
.subtitle{
  color:var(--muted);
  font-weight:300;
  margin-top:9px;
  line-height:1.5;
}
.cards{
  display:flex;
  flex-direction:column;
  gap:18px;
}
.card{
  width:100%;
  text-align:left;
  color:var(--text);
  font:inherit;
  cursor:pointer;
  padding:0;
  border:1px solid var(--border);
  border-radius:26px;
  overflow:hidden;
  background:var(--glass);
  box-shadow:0 15px 45px rgba(0,0,0,.2);
  transition:.25s ease;
}
.card:hover{
  transform:translateY(-3px);
  background:rgba(255,255,255,.11);
}
.card:active{
  transform:scale(.985);
}
.card[disabled]{
  pointer-events:none;
  opacity:.55;
}
.card-head{
  padding:22px 22px 18px;
  border-bottom:1px solid var(--border);
}
.eyebrow{
  text-transform:uppercase;
  letter-spacing:2px;
  font-size:.68rem;
  color:#aaaab1;
  margin-bottom:7px;
}
.card-title{
  font-size:1.55rem;
  font-weight:400;
}
.card-description{
  color:var(--muted);
  font-size:.9rem;
  margin-top:7px;
  line-height:1.5;
}
.menu{
  padding:20px 22px 22px;
}
.category{
  margin-bottom:19px;
}
.category:last-child{
  margin-bottom:0;
}
.category-title{
  color:#fff;
  font-size:.78rem;
  text-transform:uppercase;
  letter-spacing:1.5px;
  margin-bottom:9px;
}
.item{
  color:#d8d8dc;
  font-weight:300;
  font-size:.94rem;
  line-height:1.48;
  padding:5px 0;
}
.item strong{
  color:#fff;
  font-weight:450;
}
.footer-note{
  padding:14px 22px 20px;
  color:#85858d;
  font-size:.76rem;
  font-style:italic;
  line-height:1.5;
}
#success{
  display:none;
  text-align:center;
  margin-top:20vh;
}
body.done #choose{display:none}
body.done #success{
  display:block;
  animation:fade .7s ease both;
}
#success h2{
  font-weight:300;
  font-size:1.7rem;
}
#success p{
  color:var(--muted);
  margin-top:10px;
  line-height:1.6;
  font-weight:300;
}
#trigger{
  position:fixed;
  right:0;
  bottom:0;
  width:70px;
  height:70px;
  z-index:40;
}
/* ADMIN */
#admin{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(0,0,0,.88);
  backdrop-filter:blur(15px);
}
#admin.open{
  display:flex;
  animation:fade .25s ease both;
}
.panel{
  width:100%;
  max-width:440px;
  padding:25px;
  border-radius:26px;
  background:#1b1b24;
  border:1px solid var(--border);
  box-shadow:0 30px 90px rgba(0,0,0,.6);
}
.panel h3{
  text-align:center;
  font-weight:400;
  font-size:1.3rem;
}
.hint{
  text-align:center;
  color:var(--muted);
  font-size:.84rem;
  margin-top:6px;
}
input{
  width:100%;
  margin-top:20px;
  padding:14px;
  border-radius:14px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.07);
  color:white;
  text-align:center;
  font-size:1rem;
  outline:none;
}
button.action,
button.close{
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:14px;
  cursor:pointer;
  font-size:.96rem;
  font-weight:600;
}
button.action{
  border:0;
  color:white;
  background:linear-gradient(135deg,var(--pink),var(--purple));
}
button.close{
  background:transparent;
  color:white;
  border:1px solid var(--border);
}
.choice{
  margin-top:18px;
  padding:18px;
  border-radius:20px;
  text-align:center;
  background:rgba(255,255,255,.06);
  border:1px solid var(--border);
}
.choice-label{
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:1.5px;
  font-size:.68rem;
}
.choice-name{
  font-size:1.35rem;
  font-weight:500;
  margin-top:6px;
  line-height:1.3;
}
.choice-date{
  color:var(--muted);
  font-size:.75rem;
  margin-top:6px;
}
.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:15px;
}
.actions a{
  text-decoration:none;
  text-align:center;
  padding:13px 8px;
  border-radius:13px;
  font-size:.86rem;
  font-weight:600;
}
.book{
  color:white;
  background:linear-gradient(135deg,var(--pink),var(--purple));
}
.maps{
  color:white;
  background:rgba(255,255,255,.09);
  border:1px solid var(--border);
}
.copy{
  width:100%;
  margin-top:8px;
  padding:10px;
  border-radius:12px;
  background:transparent;
  border:1px solid rgba(255,255,255,.1);
  color:var(--muted);
}
.error{
  color:#ff7777;
  text-align:center;
  margin-top:15px;
  line-height:1.5;
}
.loading{
  text-align:center;
  color:var(--muted);
  margin-top:15px;
}
@keyframes fade{
  from{opacity:0;transform:translateY(15px)}
  to{opacity:1;transform:none}
}
@media(max-width:500px){
  body{padding:24px 13px}
  .card-title{font-size:1.4rem}
  .menu{padding:18px}
  .card-head{padding:19px}
}
@media(prefers-reduced-motion:reduce){
  .orb,.bg:before{animation:none}
  *{scroll-behavior:auto!important}
}
</style>
</head>

<script>
(() => {
'use strict';
/* =====================================================
   CONFIGURAZIONE
===================================================== */
const NTFY_TOPIC =
  'cena-sorpresa-CAMBIA-QUESTO-7k3xq9';
const ADMIN_PWD =
  'amore';
const RISTORANTI = {
  1:'I Dù dela Contrada',
  2:'Massari Gardone Riviera',
  3:'Osteria Oste Sobrio'
};
const KEY_DONE =
  'cena_scelta_inviata';
const KEY_PENDING =
  'cena_scelta_da_inviare';
const body =
  document.body;
const store = {
  get(k){
    try{
      return localStorage.getItem(k);
    }catch{
      return null;
    }
  },
  set(k,v){
    try{
      localStorage.setItem(k,v);
    }catch{}
  },
  del(k){
    try{
      localStorage.removeItem(k);
    }catch{}
  }
};
/* =====================================================
   INVIO
===================================================== */
async function invia(scelta){
  const res =
    await fetch(
      'https://ntfy.sh/' +
      encodeURIComponent(NTFY_TOPIC),
      {
        method:'POST',
        headers:{
          'Title':'Ha scelto la cena!',
          'Priority':'4',
          'Tags':'heart'
        },
        body:
          `Proposta ${scelta}: ${RISTORANTI[scelta]}`,
        keepalive:true
      }
    );
  if(!res.ok){
    throw new Error(
      'HTTP ' + res.status
    );
  }
}
async function tentaInvio(scelta){
  try{
    await invia(scelta);
    store.del(KEY_PENDING);
    store.set(
      KEY_DONE,
      String(scelta)
    );
  }catch{
    store.set(
      KEY_PENDING,
      String(scelta)
    );
  }
}
/* =====================================================
   SCELTA
===================================================== */
document
.getElementById('choose')
.addEventListener(
  'click',
  e => {
    const card =
      e.target.closest('.card');
    if(!card)return;
    const scelta =
      Number(card.dataset.choice);
    document
      .querySelectorAll('.card')
      .forEach(
        c => c.disabled = true
      );
    body.classList.add('done');
    tentaInvio(scelta);
  },
  {once:true}
);
/* =====================================================
   RIPRISTINO
===================================================== */
if(store.get(KEY_DONE)){
  body.classList.add('done');
}
const pending =
  store.get(KEY_PENDING);
if(pending){
  body.classList.add('done');
  tentaInvio(
    Number(pending)
  );
}
/* =====================================================
   AREA PRIVATA
===================================================== */
const admin =
  document.getElementById('admin');
const pwd =
  document.getElementById('pwd');
const result =
  document.getElementById('result');
let lastTap = 0;
document
.getElementById('trigger')
.addEventListener(
  'click',
  () => {
    const now =
      Date.now();
    if(now-lastTap < 450){
      admin.classList.add('open');
      pwd.focus();
    }
    lastTap = now;
  }
);
function chiudi(){
  admin.classList.remove('open');
  pwd.value='';
  result.innerHTML='';
}
document
.getElementById('close')
.addEventListener(
  'click',
  chiudi
);
admin.addEventListener(
  'click',
  e => {
    if(e.target===admin){
      chiudi();
    }
  }
);
/* =====================================================
   LINK
===================================================== */
function maps(nome){
  return (
    'https://www.google.com/maps/search/?api=1&query=' +
    encodeURIComponent(nome)
  );
}
function prenota(nome){
  return (
    'https://www.google.com/search?q=' +
    encodeURIComponent(
      nome + ' prenotazione'
    )
  );
}
function esc(s){
  return String(s)
    .replace(
      /[&<>"]/g,
      c => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;'
      }[c])
    );
}
/* =====================================================
   RIVELA
===================================================== */
async function rivela(){
  if(
    pwd.value
      .trim()
      .toLowerCase() !== ADMIN_PWD
  ){
    result.innerHTML =
      '<div class="error">Password errata.</div>';
    return;
  }
  result.innerHTML =
    '<div class="loading">Controllo la scelta…</div>';
  try{
    const res =
      await fetch(
        'https://ntfy.sh/' +
        encodeURIComponent(NTFY_TOPIC) +
        '/json?poll=1&since=all'
      );
    if(!res.ok){
      throw new Error();
    }
    const lines =
      (await res.text())
      .trim()
      .split('\n')
      .filter(Boolean);
    const messages =
      lines
        .map(line => {
          try{
            return JSON.parse(line);
          }catch{
            return null;
          }
        })
        .filter(
          m =>
            m &&
            m.event === 'message'
        );
    if(!messages.length){
      result.innerHTML =
        '<div class="error">' +
        'Nessuna scelta ricevuta.<br>' +
        '<small>Controlla il topic ntfy.</small>' +
        '</div>';
      return;
    }
    const message =
      messages[messages.length-1];
    const match =
      message.message.match(
        /Proposta\s+(\d)/
      );
    const numero =
      match ? match[1] : null;
    const nome =
      RISTORANTI[numero] ||
      message.message;
    const data =
      new Date(
        message.time * 1000
      ).toLocaleString(
        'it-IT',
        {
          dateStyle:'full',
          timeStyle:'short'
        }
      );
    result.innerHTML = `
      <div class="choice">
        <div class="choice-label">
          La scelta è...
        </div>
        <div class="choice-name">
          ${esc(nome)}
        </div>
        <div class="choice-date">
          Proposta ${esc(numero || '?')}
          · ${esc(data)}
        </div>
        <div class="actions">
          <a
            class="book"
            href="${prenota(nome)}"
            target="_blank"
            rel="noopener"
          >
            📅 PRENOTA
          </a>
          <a
            class="maps"
            href="${maps(nome)}"
            target="_blank"
            rel="noopener"
          >
            📍 MAPS
          </a>
        </div>
        <button
          class="copy"
          id="copy"
          type="button"
        >
          Copia nome ristorante
        </button>
      </div>
    `;
    document
      .getElementById('copy')
      .addEventListener(
        'click',
        async () => {
          try{
            await navigator.clipboard.writeText(nome);
            document
              .getElementById('copy')
              .textContent =
              '✓ Nome copiato';
          }catch{}
        }
      );
  }catch{
    result.innerHTML =
      '<div class="error">' +
      'Impossibile leggere la scelta.<br>' +
      'Riprova con una connessione attiva.' +
      '</div>';
  }
}
document
.getElementById('reveal')
.addEventListener(
  'click',
  rivela
);
pwd.addEventListener(
  'keydown',
  e => {
    if(e.key==='Enter'){
      rivela();
    }
  }
);
document.addEventListener(
  'keydown',
  e => {
    if(
      e.key==='Escape' &&
      admin.classList.contains('open')
    ){
      chiudi();
    }
  }
);
})();
</script>
</body>
</html>
